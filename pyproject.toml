[project]
name = "takeover-deal-hunter"
version = "0.1.0"
description = "Private acquisition underwriting backend for BUYREBSELL CORP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "pydantic-settings>=2.5,<3", "psycopg[binary]>=3.2,<4"
]
[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
